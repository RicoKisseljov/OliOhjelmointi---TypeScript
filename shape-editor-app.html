<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shape Editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .app {
            display: grid;
            grid-template-columns: 230px 1fr;
            grid-template-rows: 1fr 40px;
            height: 100vh;
        }

        #palette {
            border: 1px solid gray;
            padding: 15px;
            grid-column: 1;
            grid-row: 1;
        }

        #properties {
            border: 1px solid gray;
            border-top: none;
            padding: 15px;
        }

        #canvas-container {
            border: 1px solid gray;
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            width: 100%;
            height: 100%;
        }

        #status {
            border: 1px solid gray;
            grid-column: 1 / 3;
            grid-row: 2;
            padding: 10px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .palette-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 12px 5px;
            border: 1px solid #007bff;
            border-radius: 4px;
            background-color: #0789ed;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #006dcc;
        }

        .property {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #5d6b82;
        }

        input {
            width: 100%;
            height: 28px;
            border: 2px solid #4d96ff;
            border-radius: 3px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
        }
    </style>

    <script type="module" src="build/shape-editor-app.js"></script>
</head>

<body>

    <div class="app">

        <div class="left-panel">

            <div id="palette">

                <h2>Palette</h2>

                <div class="palette-buttons">
                    <button id="select">Select</button>
                    <button id="add-square">Add Square</button>

                    <button id="add-rectangle">Add Rectangle</button>
                    <button id="add-pentagon">Add Pentagon</button>

                    <button id="add-circle">Add Circle</button>
                    <button id="add-hexagon">Add Hexagon</button>

                    <button id="add-triangle">Add Triangle</button>
                    <button id="add-octogon">Add Octogon</button>
                </div>

            </div>

            <div id="properties">

                <h2>Properties</h2>

                <div class="property">
                    <label for="border-color">Border Color</label>
                    <input id="border-color" type="text">
                </div>

                <div class="property">
                    <label for="fill-color">Fill Color</label>
                    <input id="fill-color" type="text">
                </div>

            </div>

        </div>

        <div id="canvas-container">
            <canvas id="canvas" width="1000" height="550"></canvas>
        </div>

        <div id="status">
            Click the drawing area to add a shape
        </div>

    </div>

</body>

</html>
